name: RAG ingest

# The corpus lives in the repo, so merging a document change is what should update the vector
# store. The ingest is incremental — unchanged documents are not re-embedded — so this run
# costs seconds unless data/knowledge/ actually changed.
on:
  push:
    branches: [main]
    paths:
      - 'backend/data/knowledge/**'
      - 'backend/app/rag/**'
      - '.github/workflows/rag-ingest.yml'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Re-embed every document instead of only changed ones'
        type: boolean
        default: false

concurrency:
  # Two ingests writing the same rows would interleave; queue them instead.
  group: rag-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend

      - name: Sync the vector index
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          EMBEDDING_PROVIDER: openai
          EMBEDDING_MODEL: text-embedding-3-small
        run: |
          python -m app.rag.ingest ${{ inputs.rebuild && '--rebuild' || '' }}
