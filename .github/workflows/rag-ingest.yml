name: RAG ingest

# The corpus lives in the repo, so merging a document change is what should update the vector
# store. The ingest is incremental — unchanged documents are not re-embedded — so this run
# costs seconds unless data/knowledge/ actually changed.
on:
  push:
    branches: [main]
    paths:
      - 'backend/data/knowledge/**'
      - 'backend/app/rag/**'
      - '.github/workflows/rag-ingest.yml'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Re-embed every document instead of only changed ones'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  # Two ingests writing the same rows would interleave; queue them instead.
  group: rag-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Hosted runners cannot reach private PostgreSQL. Build the checked-out corpus
      # into an image, then execute ingestion in the VNet-connected job.
      - name: Build the corpus image
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY }}
        run: |
          az acr build --registry "$REGISTRY" --image "ilera-rag:${GITHUB_SHA::12}" ./backend

      - name: Sync the vector index inside the VNet
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          REGISTRY: ${{ vars.AZURE_REGISTRY }}
          REBUILD: ${{ inputs.rebuild && 'true' || 'false' }}
        run: |
          set -euo pipefail
          az containerapp job show -g "$RG" -n ilera-rag-ingest \
            --query properties.template -o json > /tmp/ingest-template.json
          python3 - <<'PYTHON'
          import json, os
          path = "/tmp/ingest-template.json"
          with open(path) as stream:
              template = json.load(stream)
          container = template["containers"][0]
          container["image"] = f"{os.environ['REGISTRY']}.azurecr.io/ilera-rag:{os.environ['GITHUB_SHA'][:12]}"
          container["command"] = ["python"]
          container["args"] = ["-m", "app.rag.ingest"]
          if os.environ["REBUILD"] == "true":
              container["args"].append("--rebuild")
          with open(path, "w") as stream:
              json.dump(template, stream)
          PYTHON
          execution=$(az containerapp job start -g "$RG" -n ilera-rag-ingest \
            --yaml /tmp/ingest-template.json --query name -o tsv)
          deadline=$((SECONDS + 3900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(az containerapp job execution show -g "$RG" -n ilera-rag-ingest \
              --job-execution-name "$execution" --query properties.status -o tsv)
            case "$status" in
              Succeeded) echo "Ingestion succeeded: $execution"; exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::Ingestion $execution: $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for ingestion $execution"
          exit 1
