services:
  - type: web
    name: ilera-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: REDIS_URL
        fromService:
          name: ilera-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MCP_API_KEY
        generateValue: true
      - key: POKE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: EMBEDDING_PROVIDER
        value: fastembed

  - type: redis
    name: ilera-redis
    ipAllowList: []
    plan: free
