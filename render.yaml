services:
  - type: web
    name: ilera-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MCP_API_KEY
        generateValue: true
      - key: POKE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      # Hosted embeddings: no ONNX model is loaded in this container (~300 MB resident saved).
      # The index must be ingested with the same model — these vectors are 1536-dim, fastembed's
      # are 384-dim, and nothing detects the mismatch for you.
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      # Postgres + pgvector holds the chunks and does the KNN.
      - key: DATABASE_URL
        sync: false
